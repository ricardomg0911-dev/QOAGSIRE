
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Riego Inteligente</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background:
                radial-gradient(ellipse at top right, #d6b46a18, transparent 50%),
                #090909;
        }

        .login {
            width: 100%;
            max-width: 430px;
            padding: 38px;
            background: #151515;
            border: 1px solid #333;
            border-radius: 12px;
            box-shadow: 0 20px 60px #0008;
        }

        .login-logo {
            color: #d6b46a;
            font-size: 36px;
            text-align: center;
            margin-bottom: 8px;
        }

        .login h1 {
            text-align: center;
            font-size: 27px;
        }

        .login > p {
            color: #aaa;
            text-align: center;
            margin: 10px 0 28px;
        }

        .login label {
            display: block;
            margin: 15px 0 7px;
            font-size: 14px;
        }

        .login input {
            width: 100%;
            padding: 13px;
            color: white;
            background: #090909;
            border: 1px solid #383838;
            border-radius: 5px;
            outline: none;
        }

        .login input:focus {
            border-color: #d6b46a;
        }

        .login button {
            width: 100%;
            margin-top: 25px;
        }

        #error {
            color: #ff8585;
            margin-top: 15px;
            font-size: 13px;
        }

        .volver {
            display: block;
            margin-top: 24px;
            text-align: center;
            color: #d6b46a;
            font-size: 13px;
        }

        .demo {
            margin-top: 22px;
            padding: 12px;
            border: 1px dashed #51452d;
            color: #c8b995;
            font-size: 12px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <main class="login">
        <div class="login-logo">◈</div>

        <h1>Riego Inteligente</h1>
        <p>Ingresa para administrar tu sistema de riego.</p>

        <form id="formLogin">
            <label for="usuario">Usuario</label>
            <input
                type="text"
                id="usuario"
                placeholder="Ingresa tu usuario"
                autocomplete="username"
                required>

            <label for="contrasena">Contraseña</label>
            <input
                type="password"
                id="contrasena"
                placeholder="Ingresa tu contraseña"
                autocomplete="current-password"
                required>

            <button type="submit" class="boton">
                Iniciar sesión ↗
            </button>

            <p id="error" role="alert"></p>
        </form>

    
        <a href="index.html" class="volver">
            ← Volver a la página principal
        </a>
    </main>

    <script>
        const formLogin = document.getElementById("formLogin");
        const error = document.getElementById("error");

        formLogin.addEventListener("submit", function(evento) {
            evento.preventDefault();

            const usuario =
                document.getElementById("usuario").value.trim();

            const contrasena =
                document.getElementById("contrasena").value;

            if (usuario === "admin" && contrasena === "riego123") {
                sessionStorage.setItem("sesionRiego", "activa");
                window.location.href = "panel.html";
            } else {
                error.textContent =
                    "Usuario o contraseña incorrectos.";
            }
        });
    </script>

</body>
</html>
